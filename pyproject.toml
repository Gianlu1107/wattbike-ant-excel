[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wattbike-logger"
version = "1.3.3"
description = "Wattbike ANT+ raw logger → Excel/CSV with desktop GUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Gianluca" }]
keywords = ["wattbike", "ant+", "cycling", "power", "excel"]
dependencies = [
  "openant>=1.3.0",
  "openpyxl>=3.1.0",
  "pyusb>=1.2.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.3.0"]

[project.scripts]
wattbike-logger = "wattbike_logger.__main__:main"

[project.urls]
Homepage = "https://github.com/Gianlu1107/wattbike-ant-excel"
Releases = "https://github.com/Gianlu1107/wattbike-ant-excel/releases"

[tool.setuptools.packages.find]
include = ["wattbike_logger*"]

[tool.setuptools.package-data]
wattbike_logger = ["resources/*"]
