name: Build & Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe_name: WattbikeLogger-windows-x64
            artifact: WattbikeLogger-windows-x64.zip
            libusb: windows
          - os: macos-14
            exe_name: WattbikeLogger-macos-arm64
            artifact: WattbikeLogger-macos-arm64.zip
            libusb: macos
          - os: ubuntu-22.04
            exe_name: WattbikeLogger-linux-x64
            artifact: WattbikeLogger-linux-x64.zip
            libusb: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libusb (macOS)
        if: matrix.libusb == 'macos'
        run: brew install libusb

      - name: Install libusb + zip tools (Linux)
        if: matrix.libusb == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libusb-1.0-0-dev libudev-dev upx-ucl zip

      - name: Install UPX (Windows)
        if: matrix.libusb == 'windows'
        shell: pwsh
        run: choco install upx -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build executable
        env:
          WATTBIKE_EXE_NAME: ${{ matrix.exe_name }}
        run: pyinstaller --noconfirm WattbikeLogger.spec

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/pkg | Out-Null
          $exe = if (Test-Path "dist/WattbikeLogger-windows-x64.exe") {
            "dist/WattbikeLogger-windows-x64.exe"
          } elseif (Test-Path "dist/WattbikeLogger.exe") {
            "dist/WattbikeLogger.exe"
          } else { throw "exe missing"; }
          Copy-Item $exe out/pkg/WattbikeLogger-windows-x64.exe
          Copy-Item "scripts/windows/Install-WattbikeLogger.ps1" out/pkg/
          Compress-Archive -Path out/pkg/* -DestinationPath "out/${{ matrix.artifact }}" -Force
          Get-Item "out/${{ matrix.artifact }}" | Format-List Name, Length

      - name: Package macOS zip (.app + installer)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out/pkg
          if [ -d dist/WattbikeLogger.app ]; then
            # Pulisce xattr prima della firma ad-hoc (evita "resource fork ... not allowed")
            xattr -cr dist/WattbikeLogger.app || true
            codesign --force --deep -s - dist/WattbikeLogger.app || true
            cp -R dist/WattbikeLogger.app out/pkg/
          else
            find dist -type d -name '*.app'
            echo "WattbikeLogger.app missing" >&2
            exit 1
          fi
          cp "scripts/macos/Install Wattbike Logger.command" out/pkg/
          chmod +x "out/pkg/Install Wattbike Logger.command"
          xattr -cr out/pkg/WattbikeLogger.app || true
          (
            cd out/pkg
            zip -r -y "../../out/${{ matrix.artifact }}" WattbikeLogger.app "Install Wattbike Logger.command"
          )
          ls -lh "out/${{ matrix.artifact }}"

      - name: Package Linux zip
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/pkg
          if [ -f dist/WattbikeLogger-linux-x64 ]; then
            cp dist/WattbikeLogger-linux-x64 out/pkg/
          elif [ -f dist/WattbikeLogger ]; then
            cp dist/WattbikeLogger out/pkg/WattbikeLogger-linux-x64
          else
            find dist -type f
            exit 1
          fi
          chmod +x out/pkg/WattbikeLogger-linux-x64
          cp scripts/linux/install.sh out/pkg/
          chmod +x out/pkg/install.sh
          (
            cd out/pkg
            zip -r "../../out/${{ matrix.artifact }}" WattbikeLogger-linux-x64 install.sh
          )
          ls -lh "out/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.exe_name }}
          path: out/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          mkdir -p dist
          find release-assets -type f -name '*.zip' -exec cp {} dist/ \;
          ls -lah dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
