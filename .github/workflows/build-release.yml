name: Build & Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe_name: WattbikeLogger-windows-x64
            artifact: WattbikeLogger-windows-x64-Setup.exe
            libusb: windows
          - os: macos-14
            exe_name: WattbikeLogger-macos-arm64
            artifact: WattbikeLogger-macos-arm64.pkg
            libusb: macos
          - os: ubuntu-22.04
            exe_name: WattbikeLogger-linux-x64
            artifact: WattbikeLogger-linux-x64.deb
            libusb: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: |
          V=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('wattbike_logger/__init__.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version $V"

      - name: Install libusb (macOS)
        if: matrix.libusb == 'macos'
        run: brew install libusb

      - name: Install libusb + packaging (Linux)
        if: matrix.libusb == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libusb-1.0-0-dev libudev-dev upx-ucl dpkg-dev

      - name: Install UPX + Inno Setup (Windows)
        if: matrix.libusb == 'windows'
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          choco install innosetup -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build executable
        env:
          WATTBIKE_EXE_NAME: ${{ matrix.exe_name }}
        run: pyinstaller --noconfirm WattbikeLogger.spec

      - name: Package Windows Setup.exe (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = if (Test-Path "dist/WattbikeLogger-windows-x64.exe") {
            (Resolve-Path "dist/WattbikeLogger-windows-x64.exe").Path
          } elseif (Test-Path "dist/WattbikeLogger.exe") {
            (Resolve-Path "dist/WattbikeLogger.exe").Path
          } else { throw "exe missing" }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe (Inno Setup) not found" }
          & $iscc `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceExe=$exe" `
            "/DOutputDir=$pwd\out" `
            "scripts\windows\WattbikeLogger.iss"
          if (-not (Test-Path "out\${{ matrix.artifact }}")) {
            Get-ChildItem out -Recurse | Format-Table Name, Length
            throw "Setup.exe missing"
          }
          Get-Item "out\${{ matrix.artifact }}" | Format-List Name, Length

      - name: Package macOS .pkg (Installer)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/macos/pkg/build_pkg.sh scripts/macos/pkg/scripts/postinstall
          if [ ! -d dist/WattbikeLogger.app ]; then
            find dist -type d -name '*.app' || true
            echo "WattbikeLogger.app missing" >&2
            exit 1
          fi
          ./scripts/macos/pkg/build_pkg.sh \
            "${{ steps.ver.outputs.version }}" \
            "dist/WattbikeLogger.app" \
            "out" \
            "macos-arm64"
          test -f "out/${{ matrix.artifact }}"
          ls -lh "out/${{ matrix.artifact }}"

      - name: Package Linux .deb
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/linux/build_deb.sh
          ./scripts/linux/build_deb.sh "${{ steps.ver.outputs.version }}"
          test -f "out/${{ matrix.artifact }}"
          ls -lh "out/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.exe_name }}
          path: out/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          mkdir -p dist
          find release-assets -type f \( -name '*.pkg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \) -exec cp {} dist/ \;
          ls -lah dist
          test "$(ls -A dist)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
